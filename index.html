
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swat Sayedan Family Tree</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f6f1;
  margin: 0;
  padding: 15px;
}
header {
  background: #145c3b;
  color: white;
  padding: 20px;
  text-align: center;
  border-radius: 12px;
}
.card {
  background: white;
  padding: 18px;
  margin-top: 18px;
  border-radius: 12px;
}
input {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin: 12px 0;
  border: 1px solid #aaa;
  border-radius: 8px;
  font-size: 17px;
}
button {
  display: block;
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  background: #145c3b;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
}
.person {
  padding: 12px;
  margin-top: 10px;
  background: #e5f2e8;
  border-radius: 8px;
}
</style>
</head>
<body>

<header>
<h2>Swat Sayedan</h2>
<p>Family Tree — Shajra</p>
</header>

<div class="card">
<h3>Add Family Member</h3>

<form id="familyForm">
<input id="name" placeholder="Enter Member Name" required>
<input id="father" placeholder="Enter Father's Name">
<input id="branch" placeholder="Enter Family Branch">

<button type="submit">ADD MEMBER</button>
</form>
</div>

<div class="card">
<h3>Family Members</h3>
<div id="members"></div>
</div>

<script>
let people = JSON.parse(
 localStorage.getItem("swatFamily") || "[]"
);

function displayMembers() {
 const box = document.getElementById("members");
 box.innerHTML = "";

 people.forEach(function(person) {
  const item = document.createElement("div");
  item.className = "person";
  item.textContent =
   person.name + " | Father: " +
   person.father + " | Branch: " + person.branch;
  box.appendChild(item);
 });
}

document.getElementById("familyForm")
.addEventListener("submit", function(event) {
 event.preventDefault();

 const name = document.getElementById("name").value.trim();
 const father = document.getElementById("father").value.trim();
 const branch = document.getElementById("branch").value.trim();

 if (!name) {
  alert("Please enter a name");
  return;
 }

 people.push({name, father, branch});

 localStorage.setItem("swatFamily", JSON.stringify(people));

 this.reset();
 displayMembers();

 alert("Family member added successfully!");
});

displayMembers();
</script>

</body>
</html>
