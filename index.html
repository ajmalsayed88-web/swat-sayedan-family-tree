
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swat Sayedan Family Tree</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{--person-width:190px;--line:#145c3b}

body{
 font-family:Arial,sans-serif;
 background:#f1f6f1;
 color:#183b2b;
 margin:0;
 padding:12px
}

header{
 background:#145c3b;
 color:white;
 text-align:center;
 padding:22px;
 border-radius:14px
}

.card{
 background:white;
 padding:16px;
 margin-top:14px;
 border-radius:12px;
 box-shadow:0 2px 8px #0001
}

input,select,button{
 width:100%;
 padding:13px;
 margin:7px 0;
 border-radius:8px;
 font-size:16px
}

input,select{
 border:1px solid #bdcbbf;
 background:white
}

button{
 background:#145c3b;
 color:white;
 border:0;
 font-weight:bold;
 cursor:pointer
}

button.secondary{background:#65766b}
button.danger{background:#a52b2b}
.hidden{display:none}
.small{font-size:13px;color:#617267}
#status{overflow-wrap:anywhere}

.actions{
 display:flex;
 gap:7px;
 margin-top:8px
}

.actions button{
 font-size:13px;
 padding:9px;
 margin:0
}

.tree-scroll{
 width:100%;
 overflow-x:auto;
 overflow-y:visible;
 padding:22px 8px 35px;
 -webkit-overflow-scrolling:touch
}

.tree-canvas{
 display:inline-block;
 min-width:100%;
 text-align:center
}

.family-node{
 display:flex;
 flex-direction:column;
 align-items:center;
 flex:0 0 auto;
 position:relative
}

.person{
 width:var(--person-width);
 background:#e7f3e9;
 border:1px solid #b8d5bf;
 border-radius:11px;
 padding:12px 10px;
 min-height:58px;
 text-align:center;
 box-shadow:0 2px 6px #0000000d;
 overflow-wrap:anywhere;
 position:relative;
 z-index:1
}

.person strong{font-size:15px}

.person.root{
 background:#145c3b;
 color:white;
 border-color:#145c3b
}

.person .small{margin-top:5px}
.person.root .small{color:#e1f1e5}

.person.search-match{
 background:#fff0a8!important;
 color:#183b2b!important;
 border:3px solid #d18b00;
 box-shadow:0 0 0 5px #f5d98a
}

/* CLEAR FATHER-TO-SON CONNECTORS */

.children-row{
 display:flex;
 width:max-content;
 max-width:none;
 align-items:flex-start;
 justify-content:center;
 gap:22px;
 position:relative;
 padding-top:42px;
 margin-left:auto;
 margin-right:auto
}

/* Continuous horizontal line connecting all sons */
left:calc(var(--person-width)/2);
right:calc(var(--person-width)/2);
/* Vertical line from father to sons' line */
.children-row:after{
 content:"";
 position:absolute;
 top:-42px;
 left:50%;
 height:42px;
 border-left:4px solid var(--line)
}

/* Vertical line from connecting line to each son */
.children-row>.family-node:before{
 content:"";
 position:absolute;
 top:0;
 left:50%;
 height:29px;
 border-left:4px solid var(--line)
}

/* Downward arrow pointing to each son */
.children-row>.family-node:after{
 content:"";
 position:absolute;
 top:24px;
 left:calc(50% - 7px);
 border-left:7px solid transparent;
 border-right:7px solid transparent;
 border-top:10px solid var(--line);
 z-index:2
}

/* Hide horizontal line if there is only one son */
.children-row:has(>.family-node:only-child):before{
 display:none
}

.generation-label{
 font-size:12px;
 color:#718477;
 margin:14px 0 2px
}

.unlinked-area{
 margin-top:22px;
 border-top:1px dashed #c5d3c8;
 padding-top:14px;
 text-align:left
}

.unlinked-area h3{font-size:15px}

#searchStatus{
 margin:4px 0 10px
}

@media(max-width:600px){
 body{padding:8px}
 .card{padding:12px}
 .tree-scroll{
  padding-left:4px;
  padding-right:4px
 }
 :root{--person-width:160px}
 .person{padding:10px 7px}
 .children-row{gap:12px}
}
</style>
</head>

<body>

<header>
<h1>Swat Sayedan</h1>
<p>Family Tree — Shajra</p>
</header>

<section class="card">
<h2>Administrator Login</h2>

<div id="loginBox">
<input id="email" type="email" placeholder="Administrator email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="adminBox" class="hidden">
<p>Administrator logged in</p>
<button class="secondary" onclick="logout()">Logout</button>
</div>

<p id="status" class="small">Loading family tree...</p>
</section>

<section class="card hidden" id="addBox">
<h2 id="formTitle">Add Family Member</h2>

<input id="memberName" placeholder="Member's name">

<label>Father's name</label>
<select id="father">
<option value="">Father unknown / not added</option>
</select>

<input id="branch" placeholder="Family branch (optional)">

<button onclick="saveMember()">Save Member</button>
<button class="secondary hidden" id="cancelEdit" onclick="cancelEditing()">Cancel Edit</button>
</section>

<section class="card">
<h2>Our Family Tree</h2>

<p class="small">
Every father is connected to his sons with clear lines and arrows.
Swipe sideways to see all family branches.
</p>

<input
 id="searchInput"
 type="search"
 placeholder="Search family member by name"
 oninput="searchFamily()"
>

<p id="searchStatus" class="small">
Type a name to find a family member.
</p>

<div class="tree-scroll">
<div id="tree" class="tree-canvas"></div>
</div>
</section>

<script>
const SUPABASE_URL = "https://mkpgibnfftqihoztpnhy.supabase.co";
const SUPABASE_KEY = "sb_publishable_t8OgRxv90fao6omiHsTmiw_1UfkbkUc";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let members=[];
let isAdmin=false;
let editingId=null;

function status(message){
 document.getElementById("status").textContent=message;
}

async function loadMembers(){
 const {data,error}=await db.from("family_members")
 .select("*").eq("approved",true).order("name");

 if(error){
  status("Database error: "+error.message);
  return;
 }

 members=data||[];
 loadFatherOptions();
 renderTree();
}

async function checkAdmin(){
 const {data:{session}}=await db.auth.getSession();

 if(!session){
  showAdmin(false);
  return;
 }

 const {data,error}=await db.from("family_admins")
 .select("user_id").eq("user_id",session.user.id).maybeSingle();

 if(error){
  status("Admin check failed: "+error.message);
  return;
 }

 showAdmin(!!data);

 if(data)await ensureRoot();
}

function showAdmin(value){
 isAdmin=value;
 document.getElementById("loginBox").classList.toggle("hidden",value);
 document.getElementById("adminBox").classList.toggle("hidden",!value);
 document.getElementById("addBox").classList.toggle("hidden",!value);
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email||!password){
  status("Enter your email and password.");
  return;
 }

 const {error}=await db.auth.signInWithPassword({email,password});

 if(error){
  status("Login failed: "+error.message);
  return;
 }

 await checkAdmin();

 if(isAdmin){
  status("Administrator login successful.");
  await loadMembers();
 }else{
  status("This account is not an administrator.");
 }
}

async function logout(){
 await db.auth.signOut();
 showAdmin(false);
 cancelEditing();
 status("Logged out.");
 await loadMembers();
}

async function ensureRoot(){
 const {data,error}=await db.from("family_members")
 .select("id").eq("name","Peer Baba").limit(1);

 if(error){
  status(error.message);
  return;
 }

 if(!data.length){
  const {error:insertError}=await db.from("family_members")
  .insert({
   name:"Peer Baba",
   branch:"Common Ancestor",
   approved:true
  });

  if(insertError){
   status("Could not add starting ancestor: "+insertError.message);
   return;
  }
 }
}

function loadFatherOptions(){
 const select=document.getElementById("father");
 const previous=select.value;

 select.innerHTML='<option value="">Father unknown / not added</option>';

 members.forEach(m=>{
  if(m.id===editingId)return;

  const o=document.createElement("option");
  o.value=m.id;
  o.textContent=m.name;
  select.appendChild(o);
 });

 if([...select.options].some(o=>o.value===previous)){
  select.value=previous;
 }
}

function makePersonCard(m){
 const node=document.createElement("div");
 node.className="family-node";

 const card=document.createElement("div");
 card.className="person"+(m.name==="Peer Baba"?" root":"");
 card.dataset.memberId=m.id;

 const name=document.createElement("strong");
 name.textContent=m.name;
 card.appendChild(name);

 if(m.branch){
  const b=document.createElement("div");
  b.className="small";
  b.textContent=m.branch;
  card.appendChild(b);
 }

 if(isAdmin){
  const actions=document.createElement("div");
  actions.className="actions";

  const edit=document.createElement("button");
  edit.textContent="Edit";
  edit.onclick=()=>editMember(m.id);
  actions.appendChild(edit);

  const del=document.createElement("button");
  del.textContent="Delete";
  del.className="danger";
  del.onclick=()=>deleteMember(m.id);
  actions.appendChild(del);

  card.appendChild(actions);
 }

 node.appendChild(card);
 return node;
}

function makeBranch(m,seen){
 if(seen.has(m.id))return null;
 seen.add(m.id);

 const node=makePersonCard(m);
 const children=members.filter(x=>x.father_id===m.id);

 if(children.length){
  const row=document.createElement("div");
  row.className="children-row";

  children.forEach(child=>{
   const branch=makeBranch(child,seen);
   if(branch)row.appendChild(branch);
  });

  if(row.children.length)node.appendChild(row);
 }

 return node;
}

function searchFamily(){
 const input=document.getElementById("searchInput");
 const message=document.getElementById("searchStatus");
 const query=input.value.trim().toLowerCase();

 document.querySelectorAll(".person.search-match").forEach(el=>{
  el.classList.remove("search-match");
 });

 if(!query){
  message.textContent="Type a name to find a family member.";
  return;
 }

 const matches=members.filter(m=>
  m.name.toLowerCase().includes(query)
 );

 if(!matches.length){
  message.textContent="No family member found with that name.";
  return;
 }

 message.textContent=matches.length+" matching member(s) found.";

 matches.forEach(m=>{
  const card=document.querySelector(
   '[data-member-id="'+m.id+'"]'
  );

  if(card)card.classList.add("search-match");
 });

 const firstCard=document.querySelector(
  '[data-member-id="'+matches[0].id+'"]'
 );

 if(firstCard){
  firstCard.scrollIntoView({
   behavior:"smooth",
   block:"center",
   inline:"center"
  });
 }
}

function renderTree(){
 const box=document.getElementById("tree");
 box.innerHTML="";

 const seen=new Set();
 const root=members.find(m=>m.name==="Peer Baba");

 if(root){
  const label=document.createElement("div");
  label.className="generation-label";
  label.textContent="COMMON ANCESTOR";
  box.appendChild(label);

  const branch=makeBranch(root,seen);
  if(branch)box.appendChild(branch);
 }

 const unlinked=members.filter(m=>!seen.has(m.id));

 if(unlinked.length){
  const area=document.createElement("div");
  area.className="unlinked-area";

  const heading=document.createElement("h3");
  heading.textContent="Members not yet connected to Peer Baba";
  area.appendChild(heading);

  const row=document.createElement("div");
  row.className="children-row";

  unlinked.forEach(m=>{
   const branch=makeBranch(m,seen);
   if(branch)row.appendChild(branch);
  });

  area.appendChild(row);
  box.appendChild(area);
 }

 if(!members.length){
  box.textContent="No family members have been added yet.";
 }
}

async function saveMember(){
 if(!isAdmin)return;

 const name=document.getElementById("memberName").value.trim();
 const fatherId=document.getElementById("father").value||null;
 const branch=document.getElementById("branch").value.trim();

 if(!name){
  status("Enter a member name.");
  return;
 }

 if(name.toLowerCase()==="peer baba"&&editingId){
  status("The common ancestor cannot be renamed.");
  return;
 }

 const duplicate=members.some(m=>
  m.name.toLowerCase()===name.toLowerCase()&&m.id!==editingId
 );

 if(duplicate){
  status("This name already exists. Check before adding.");
  return;
 }

 if(editingId){
  const {error}=await db.from("family_members")
  .update({name,father_id:fatherId,branch})
  .eq("id",editingId);

  if(error){
   status("Update failed: "+error.message);
   return;
  }

  status("Member updated.");
 }else{
  const {error}=await db.from("family_members")
  .insert({
   name,
   father_id:fatherId,
   branch,
   approved:true
  });

  if(error){
   status("Add failed: "+error.message);
   return;
  }

  status("Member added successfully.");
 }

 cancelEditing();
 await loadMembers();
}

function editMember(id){
 const m=members.find(x=>x.id===id);

 if(!m||m.name==="Peer Baba")return;

 editingId=id;

 document.getElementById("memberName").value=m.name;
 document.getElementById("branch").value=m.branch||"";

 loadFatherOptions();
 document.getElementById("father").value=m.father_id||"";

 document.getElementById("formTitle").textContent="Edit Family Member";
 document.getElementById("cancelEdit").classList.remove("hidden");
 document.getElementById("addBox").scrollIntoView({behavior:"smooth"});
}

function cancelEditing(){
 editingId=null;

 document.getElementById("memberName").value="";
 document.getElementById("branch").value="";
 document.getElementById("father").value="";

 document.getElementById("formTitle").textContent="Add Family Member";
 document.getElementById("cancelEdit").classList.add("hidden");

 loadFatherOptions();
}

async function deleteMember(id){
 if(!isAdmin)return;

 const m=members.find(x=>x.id===id);

 if(!m||m.name==="Peer Baba")return;

 if(members.some(x=>x.father_id===id)){
  status("Cannot delete this person yet. They have children connected to them.");
  return;
 }

 if(!confirm("Delete "+m.name+"? This cannot be undone."))return;

 const {error}=await db.from("family_members").delete().eq("id",id);

 if(error){
  status("Delete failed: "+error.message);
  return;
 }

 status("Member deleted.");
 await loadMembers();
}

async function start(){
 if(SUPABASE_URL.includes("PASTE_")||SUPABASE_KEY.includes("PASTE_")){
  status("Please add your Supabase Project URL and Publishable key in the code.");
  return;
 }

 await checkAdmin();
 await loadMembers();
}

start();
</script>
</body>
</html>
