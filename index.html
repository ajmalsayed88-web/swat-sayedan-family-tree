
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swat Sayedan Shajra</title>
<style>
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#f1f6f1;
  margin:0;padding:14px;color:#183b2b
}
header{
  background:#145c3b;color:white;text-align:center;
  padding:24px 12px;border-radius:14px
}
header h1{margin:0 0 8px}
.card{
  background:white;padding:17px;margin-top:16px;
  border-radius:13px;box-shadow:0 2px 9px #0000000d
}
h2{font-size:19px}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,select{
  display:block;width:100%;padding:14px;
  border:1px solid #b8c8bc;border-radius:8px;
  font-size:16px;background:white
}
button{
  width:100%;padding:15px;margin-top:16px;
  background:#145c3b;color:white;border:0;
  border-radius:8px;font-size:17px;font-weight:bold
}
.tree ul{
  list-style:none;margin:10px 0 0 14px;
  padding-left:18px;border-left:2px solid #a8c9b1
}
.tree li{
  position:relative;margin:13px 0;padding-left:8px
}
.tree li:before{
  content:"";position:absolute;left:-18px;
  top:19px;width:17px;border-top:2px solid #a8c9b1
}
.tree ul.root-list{
  border:0;margin:0;padding:0
}
.person{
  display:inline-block;background:#e7f3e9;
  border:1px solid #c6dfcb;border-radius:9px;
  padding:12px;max-width:100%;overflow-wrap:anywhere
}
.person.root{
  background:#145c3b;color:white;
  border-color:#145c3b;font-weight:bold
}
.person small{
  display:block;margin-top:5px;
  opacity:.8;font-weight:normal
}
.hint{font-size:13px;color:#617267;line-height:1.5}
</style>
</head>
<body>

<header>
<h1>Swat Sayedan</h1>
<p>Family Tree — Shajra</p>
</header>

<section class="card">
<h2>Add Family Member</h2>

<form id="familyForm">
<label for="name">Member's Name</label>
<input id="name" placeholder="Enter member's name" required>

<label for="father">Father's Name</label>
<select id="father">
<option value="">Father unknown / not added</option>
</select>

<label for="branch">Family Branch (optional)</label>
<input id="branch" placeholder="Enter family branch">

<button type="submit">ADD MEMBER</button>
</form>

<p class="hint">
Select the person's father to connect them to the correct family branch.
</p>
</section>

<section class="card">
<h2>Our Family Tree</h2>
<div id="tree" class="tree"></div>
</section>

<script>
const KEY="swatFamily";
let people=[];

try{
 people=JSON.parse(localStorage.getItem(KEY)||"[]");
}catch(e){people=[];}

if(!Array.isArray(people))people=[];

// Preserve existing members
people=people.map((p,i)=>({
 id:p.id||("old-"+i),
 name:String(p.name||"").trim(),
 fatherId:p.fatherId||"",
 father:p.father||"",
 branch:p.branch||""
})).filter(p=>p.name);

// Add Peer Baba as the starting ancestor
let root=people.find(
 p=>p.name.toLowerCase()==="peer baba"
);

if(!root){
 root={
  id:"peer-baba-root",
  name:"Peer Baba",
  fatherId:"",
  father:"",
  branch:"Common Ancestor"
 };
 people.unshift(root);
}

// Connect existing members by father's name if possible
people.forEach(p=>{
 if(!p.fatherId && p.father){
  let match=people.find(x=>
   x.name.toLowerCase()===p.father.toLowerCase()
   && x.id!==p.id
  );
  if(match)p.fatherId=match.id;
 }
});

function save(){
 localStorage.setItem(KEY,JSON.stringify(people));
}

function loadFathers(){
 const select=document.getElementById("father");
 select.innerHTML=
 '<option value="">Father unknown / not added</option>';

 people.forEach(p=>{
  const option=document.createElement("option");
  option.value=p.id;
  option.textContent=p.name;
  select.appendChild(option);
 });
}

function createCard(p){
 const card=document.createElement("div");
 card.className="person";
 if(p.name.toLowerCase()==="peer baba"){
  card.classList.add("root");
 }
 const name=document.createElement("div");
 name.textContent=p.name;
 card.appendChild(name);

 if(p.branch){
  const small=document.createElement("small");
  small.textContent=p.branch;
  card.appendChild(small);
 }
 return card;
}

function makeBranch(person,seen){
 if(seen.has(person.id))return null;
 seen.add(person.id);

 const li=document.createElement("li");
 li.appendChild(createCard(person));

 const children=people.filter(
  p=>p.fatherId===person.id
 );

 if(children.length){
  const ul=document.createElement("ul");
  children.forEach(child=>{
   const branch=makeBranch(child,seen);
   if(branch)ul.appendChild(branch);
  });
  li.appendChild(ul);
 }
 return li;
}

function showTree(){
 const box=document.getElementById("tree");
 box.innerHTML="";
 const seen=new Set();

 const root=people.find(
  p=>p.name.toLowerCase()==="peer baba"
 );

 if(root){
  const ul=document.createElement("ul");
  ul.className="root-list";
  const branch=makeBranch(root,seen);
  if(branch)ul.appendChild(branch);
  box.appendChild(ul);
 }

 const other=people.filter(p=>!seen.has(p.id));

 if(other.length){
  const note=document.createElement("p");
  note.className="hint";
  note.textContent=
   "Other members not yet connected to Peer Baba:";
  box.appendChild(note);

  const ul=document.createElement("ul");
  other.forEach(p=>{
   const li=document.createElement("li");
   li.appendChild(createCard(p));
   ul.appendChild(li);
  });
  box.appendChild(ul);
 }
}

document.getElementById("familyForm")
.addEventListener("submit",function(e){
 e.preventDefault();

 const name=document.getElementById("name").value.trim();
 const fatherId=document.getElementById("father").value;
 const branch=document.getElementById("branch").value.trim();

 if(!name)return;

 if(people.some(p=>
  p.name.toLowerCase()===name.toLowerCase()
 )){
  alert("This name already exists.");
  return;
 }

 people.push({
  id:"member-"+Date.now(),
  name:name,
  fatherId:fatherId,
  branch:branch
 });

 save();
 this.reset();
 loadFathers();
 showTree();
 alert("Member added successfully!");
});

save();
loadFathers();
showTree();
</script>

</body>
</html>
