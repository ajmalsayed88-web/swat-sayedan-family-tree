
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ancestors History | Manglor Sayedan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f7f2;
 color:#26352a;
}
header{
 background:linear-gradient(135deg,#174d32,#287447);
 color:white;
 text-align:center;
 padding:35px 18px;
}
header h1{margin:0 0 10px;font-size:30px}
header p{margin:0;color:#e2eee4}
.container{max-width:1050px;margin:25px auto;padding:0 16px}
.top-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
button{
 border:0;border-radius:7px;padding:11px 17px;
 background:#24643d;color:white;cursor:pointer;font-size:14px;
}
button:hover{opacity:.88}
.back{background:#344b3b}
.search-box{
 margin:22px 0;padding:17px;background:white;
 border-radius:10px;box-shadow:0 2px 9px #0000000d;
}
input,textarea{
 width:100%;padding:12px;margin:7px 0 14px;
 border:1px solid #ccd6cd;border-radius:6px;font:inherit;
}
textarea{min-height:160px;resize:vertical}
.entry{
 background:white;border-radius:10px;margin:18px 0;
 padding:20px;box-shadow:0 2px 10px #0000000c;
}
.entry h2{color:#205d38;margin:0 0 7px}
.entry h3{margin:0 0 13px;color:#657267;font-weight:normal}
.entry img{
 width:100%;
 max-height:500px;
 height:auto;
 object-fit:contain;
 border-radius:8px;margin:8px 0 15px;
}
.history-text{line-height:1.8;white-space:pre-wrap}
.admin-box{
 background:white;padding:20px;border-radius:10px;
 margin:22px 0;box-shadow:0 2px 10px #0000000c;
}
.hidden{display:none!important}
.entry-actions{display:flex;gap:8px;margin-top:15px}
.entry-actions button:last-child{background:#a63737}
#status{margin:12px 0;color:#a13b2b}
.empty{text-align:center;padding:35px;color:#718073}
footer{text-align:center;padding:25px;color:#758078}
</style>
</head>

<body>

<header>
 <h1>Ancestors History</h1>
 <p>Preserving the lives, memories and legacy of Manglor Sayedan</p>
</header>

<div class="container">

 <div class="top-actions">
  <button class="back" onclick="location.href='index.html'">← Back to Home</button>
  <button id="languageToggle" onclick="toggleHistoryLanguage()">اردو</button>
  <button id="loginToggle" onclick="showLogin()">Admin Login</button>
</div>

 <div class="search-box">
  <h3>Search Ancestors History</h3>
  <input id="searchInput" type="search"
   placeholder="Search ancestor name or history..."
   oninput="renderHistories()">
 </div>

 <section id="loginBox" class="admin-box hidden">
  <h3>Administrator Login</h3>
  <input id="email" type="email" placeholder="Admin email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button class="back" onclick="hideLogin()">Cancel</button>
 </section>

 <section id="adminBox" class="admin-box hidden">
  <h3>Manage Ancestors History</h3>
  <p>Add a new ancestor's history or update an existing entry.</p>

  <label>Ancestor Name</label>
  <input id="ancestorName" placeholder="Enter ancestor name">

  <label>History Title</label>
  <input id="historyTitle" placeholder="Enter history title">

  <label>Written History</label>
  <textarea id="historyText" placeholder="Write the ancestor's history here..."></textarea>
<label>Ancestor Name (Urdu)</label>
<input id="ancestorNameUr" placeholder="بزرگ کا نام اردو میں">

<label>History Title (Urdu)</label>
<input id="historyTitleUr" placeholder="تاریخ کا عنوان اردو میں">

<label>Written History (Urdu)</label>
<textarea id="historyTextUr" placeholder="بزرگ کی تاریخ اردو میں لکھیں..."></textarea>
  <button type="button" onclick="translateUrduHistory()">
 Translate Urdu to English
</button>
  <label>Ancestor Photograph</label>
  <input id="historyPhoto" type="file" accept="image/*">

  <button onclick="saveHistory()">Save History</button>
  <button class="back" onclick="clearForm()">Clear Form</button>
  <button onclick="logout()">Logout</button>
  <p id="status" role="status"></p>
 </section>

 <div id="historyList">
  <div class="empty">Loading ancestors history...</div>
 </div>

</div>

<footer>
 Manglor Sayedan Family Heritage
</footer>

<script>
const SUPABASE_URL = "https://mkpgibnfftqihoztpnhy.supabase.co";
const SUPABASE_KEY = "sb_publishable_t8OgRxv90fao6omiHsTmiw_1UfkbkUc";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let histories = [];
 let currentLanguage = localStorage.getItem("manglorLanguage") || "en";
let isAdmin = false;
let editingId = null;
let currentPhotoUrl = "";

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}
 const historyTranslations = {
 "Ancestors History": "آباؤ اجداد کی تاریخ",
 "Preserving the lives, memories and legacy of Manglor Sayedan": "منگلور سیدان کی شخصیات، یادوں اور ورثے کو محفوظ رکھنا",
 "Back to Home": "ہوم پر واپس جائیں",
 "Admin Login": "ایڈمن لاگ اِن",
 "Search Ancestors History": "آباؤ اجداد کی تاریخ تلاش کریں",
 "Search ancestor name or history...": "بزرگ کا نام یا تاریخ تلاش کریں...",
 "Administrator Login": "منتظم کا لاگ اِن",
 "Admin email": "ایڈمن کی ای میل",
 "Password": "پاس ورڈ",
 "Login": "لاگ اِن",
 "Cancel": "منسوخ کریں",
 "Manage Ancestors History": "آباؤ اجداد کی تاریخ کا انتظام",
 "Add a new ancestor's history or update an existing entry.": "کسی نئے بزرگ کی تاریخ شامل کریں یا پہلے سے موجود تاریخ میں ترمیم کریں۔",
 "Ancestor Name": "بزرگ کا نام",
 "History Title": "تاریخ کا عنوان",
 "Written History": "تحریری تاریخ",
 "Enter ancestor name": "بزرگ کا نام درج کریں",
 "Enter history title": "تاریخ کا عنوان درج کریں",
 "Write the ancestor's history here...": "یہاں بزرگ کی تاریخ لکھیں...",
 "Ancestor Name (Urdu)": "بزرگ کا نام (اردو)",
 "History Title (Urdu)": "تاریخ کا عنوان (اردو)",
 "Written History (Urdu)": "تحریری تاریخ (اردو)",
 "Ancestor Photograph": "بزرگ کی تصویر",
 "Save History": "تاریخ محفوظ کریں",
 "Clear Form": "فارم صاف کریں",
 "Logout": "لاگ آؤٹ",
 "Edit": "ترمیم",
 "Delete": "حذف کریں",
 "No matching ancestors history found.": "مطلوبہ بزرگ کی تاریخ نہیں ملی۔",
 "Loading ancestors history...": "بزرگوں کی تاریخ لوڈ ہو رہی ہے...",
 "Manglor Sayedan Family Heritage": "منگلور سیدان کا خاندانی ورثہ"
};

const historyEnglishText = new WeakMap();

function translateHistoryPage(){
 const isUrdu = currentLanguage === "ur";

 document.documentElement.lang = currentLanguage;
 document.documentElement.dir = isUrdu ? "rtl" : "ltr";
 document.body.dir = isUrdu ? "rtl" : "ltr";

 const walker = document.createTreeWalker(
  document.body,
  NodeFilter.SHOW_TEXT
 );

 let node;

 while((node = walker.nextNode())){
  if(!historyEnglishText.has(node)){
   historyEnglishText.set(node,node.nodeValue);
  }

  const original = historyEnglishText.get(node);
  const key = original.trim();

  if(isUrdu && historyTranslations[key]){
   node.nodeValue = original.replace(key,historyTranslations[key]);
  }else{
   node.nodeValue = original;
  }
 }

 document.querySelectorAll("[placeholder]").forEach(el => {
  if(!el.dataset.englishPlaceholder){
   el.dataset.englishPlaceholder = el.getAttribute("placeholder");
  }

  const original = el.dataset.englishPlaceholder;
  el.setAttribute(
   "placeholder",
   isUrdu ? (historyTranslations[original] || original) : original
  );
 });

 document.getElementById("languageToggle").textContent =
  isUrdu ? "English" : "اردو";
}
function toggleHistoryLanguage(){
 currentLanguage = currentLanguage === "en" ? "ur" : "en";
 localStorage.setItem("manglorLanguage", currentLanguage);

 renderHistories();
 translateHistoryPage();
}
function showLogin(){
 document.getElementById("loginBox").classList.remove("hidden");
}
function hideLogin(){
 document.getElementById("loginBox").classList.add("hidden");
}

function message(text){
 document.getElementById("status").textContent = text;
}

async function checkAdmin(){
 const {data:{session}} = await db.auth.getSession();

 if(!session){
  isAdmin = false;
  updateAdminView();
  return;
 }

 const {data,error} = await db.from("family_admins")
  .select("user_id")
  .eq("user_id",session.user.id)
  .maybeSingle();

 if(error){
  console.error(error);
  return;
 }

 isAdmin = !!data;
 updateAdminView();
}

function updateAdminView(){
 document.getElementById("adminBox").classList.toggle("hidden",!isAdmin);
 document.getElementById("loginToggle").classList.toggle("hidden",isAdmin);
}

async function login(){
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 const {error} = await db.auth.signInWithPassword({email,password});

 if(error){
  alert("Login failed: "+error.message);
  return;
 }

 await checkAdmin();

 if(!isAdmin){
  await db.auth.signOut();
  alert("This account is not an authorized family administrator.");
  return;
 }

 hideLogin();
}

async function logout(){
 await db.auth.signOut();
 isAdmin = false;
 editingId = null;
 clearForm();
 updateAdminView();
}

async function loadHistories(){
 const {data,error} = await db.from("ancestor_histories")
  .select("*")
  .eq("published",true)
  .order("ancestor_name");

 if(error){
  document.getElementById("historyList").innerHTML =
   '<div class="empty">Could not load history. Please refresh the page.</div>';
  console.error(error);
  return;
 }

 histories = data || [];
 renderHistories();
}

function renderHistories(){
 const term = document.getElementById("searchInput").value
  .trim().toLowerCase();

 const filtered = histories.filter(item =>
  (item.ancestor_name || "").toLowerCase().includes(term) ||
  (item.title || "").toLowerCase().includes(term) ||
  (item.history || "").toLowerCase().includes(term) ||
  (item.ancestor_name_ur || "").toLowerCase().includes(term) ||
  (item.title_ur || "").toLowerCase().includes(term) ||
  (item.history_ur || "").toLowerCase().includes(term)
);

 const list = document.getElementById("historyList");

 if(!filtered.length){
  list.innerHTML = '<div class="empty">No matching ancestors history found.</div>';
  return;
 }

 list.innerHTML = filtered.map(item => `
  <article class="entry">
   <h2 dir="${currentLanguage === "ur" ? "rtl" : "ltr"}">${safe(currentLanguage === "ur" ? (item.ancestor_name_ur || item.ancestor_name) : item.ancestor_name)}</h2>
<h3 dir="${currentLanguage === "ur" ? "rtl" : "ltr"}">${safe(currentLanguage === "ur" ? (item.title_ur || item.title || "") : (item.title || ""))}</h3>
${item.photo_url ? `<img src="${safe(item.photo_url)}" alt="Photograph of ${safe(item.ancestor_name)}">` : ""}
<div class="history-text" dir="${currentLanguage === "ur" ? "rtl" : "ltr"}">${safe(currentLanguage === "ur" ? (item.history_ur || item.history) : item.history)}</div>
   ${isAdmin ? `
    <div class="entry-actions">
     <button onclick="editHistory(${Number(item.id)})">Edit</button>
     <button onclick="deleteHistory(${Number(item.id)})">Delete</button>
    </div>` : ""}
  </article>
 `).join("");
}

async function saveHistory(){
 if(!isAdmin)return;

 const ancestor_name = document.getElementById("ancestorName").value.trim();
 const title = document.getElementById("historyTitle").value.trim();
 const history = document.getElementById("historyText").value.trim();
 const file = document.getElementById("historyPhoto").files[0];

 if(!ancestor_name || !history){
  message("Please enter the ancestor name and history.");
  return;
 }

 message("Saving...");

 let photo_url = currentPhotoUrl;

 if(file){
  const extension = file.name.split(".").pop().toLowerCase();
  const filePath = Date.now()+"-"+Math.random().toString(36).slice(2)+"."+extension;

  const {error:uploadError} = await db.storage
   .from("ancestor-history-photos")
   .upload(filePath,file,{upsert:false});

  if(uploadError){
   message("Photo upload failed: "+uploadError.message);
   return;
  }

  const {data:urlData} = db.storage
   .from("ancestor-history-photos")
   .getPublicUrl(filePath);

  photo_url = urlData.publicUrl;
 }

 const record = {
  ancestor_name,
  title,
  history,
  ancestor_name_ur: document.getElementById("ancestorNameUr").value.trim(),
  title_ur: document.getElementById("historyTitleUr").value.trim(),
  history_ur: document.getElementById("historyTextUr").value.trim(),
  photo_url,
  published:true
};

 let result;

 if(editingId){
  result = await db.from("ancestor_histories")
   .update(record).eq("id",editingId);
 }else{
  result = await db.from("ancestor_histories").insert(record);
 }

 if(result.error){
  message("Save failed: "+result.error.message);
  return;
 }

 message("History saved successfully.");
 clearForm();
 await loadHistories();
}

function editHistory(id){
 if(!isAdmin)return;

 const item = histories.find(x => Number(x.id) === Number(id));
 if(!item)return;

 editingId = item.id;
 currentPhotoUrl = item.photo_url || "";

 document.getElementById("ancestorName").value = item.ancestor_name || "";
 document.getElementById("historyTitle").value = item.title || "";
 document.getElementById("historyText").value = item.history || "";
 document.getElementById("ancestorNameUr").value = item.ancestor_name_ur || "";
document.getElementById("historyTitleUr").value = item.title_ur || "";
document.getElementById("historyTextUr").value = item.history_ur || "";
 document.getElementById("historyPhoto").value = "";

 document.getElementById("adminBox").scrollIntoView({behavior:"smooth"});
 message("Editing: "+item.ancestor_name);
}

async function deleteHistory(id){
 if(!isAdmin)return;
 if(!confirm("Are you sure you want to delete this history?"))return;

 const {error} = await db.from("ancestor_histories")
  .delete().eq("id",id);

 if(error){
  alert("Delete failed: "+error.message);
  return;
 }

 await loadHistories();
 message("History deleted.");
}

function clearForm(){
 editingId = null;
 currentPhotoUrl = "";
 document.getElementById("ancestorName").value = "";
 document.getElementById("historyTitle").value = "";
 document.getElementById("historyText").value = "";
 document.getElementById("ancestorNameUr").value = "";
 document.getElementById("historyTitleUr").value = "";
 document.getElementById("historyTextUr").value = "";
 document.getElementById("historyPhoto").value = "";
}

db.auth.onAuthStateChange(() => {
 setTimeout(checkAdmin,0);
});

async function start(){
 currentLanguage = localStorage.getItem("manglorLanguage") || "en";

 await checkAdmin();
 await loadHistories();

 translateHistoryPage();
}

start();
</script>

</body>
</html>
