
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swat Sayedan Family Heritage Portal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #00351d;
}

.portal {
    position: relative;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

.portal img {
    display: block;
    width: 100%;
    height: auto;
}

.card-link {
    position: absolute;
    display: block;
    border-radius: 18px;
    cursor: pointer;
}

/* Top row */
.heritage {
    left: 11.2%;
    top: 45.4%;
    width: 37.8%;
    height: 11.2%;
}

.family {
    left: 51%;
    top: 45.4%;
    width: 37.8%;
    height: 11.2%;
}

/* Bottom row */
.gallery {
    left: 11.2%;
    top: 58%;
    width: 37.8%;
    height: 11.1%;
}

.admin {
    left: 51%;
    top: 58%;
    width: 37.8%;
    height: 11.1%;
}

.card-link:focus-visible {
    outline: 3px solid white;
    outline-offset: 3px;
}
</style>
</head>

<body>

<div class="portal">

    <img
        src="Swat%20Sayedan%20Family%20Heritage%20Portal.png"
        alt="Swat Sayedan Family Heritage Portal"
    >

    <a class="card-link heritage"
       href="index.html"
       aria-label="Heritage Dashboard"
       title="Heritage Dashboard"></a>

    <a class="card-link family"
       href="family-tree.html"
       aria-label="Family Tree"
       title="Family Tree"></a>

    <a class="card-link gallery"
       href="#"
       aria-label="Our Gallery"
       title="Our Gallery"
       onclick="alert('Gallery page will be added later.'); return false;"></a>

    <a class="card-link admin"
      href="index.html?openAdmin=1"
       aria-label="Administration"
       title="Administration"></a>

</div>

</body>
</html>
